<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>F1liveSchedule</title>
</head>
<body>
  <main>
    <h1>F1 live Schedule</h1>
    <p class="page-intro">2026年の今後のF1日程を日本時間で表示しています。セッション状態は予定時刻を基準に判定しています。</p>

    <section class="display-session" aria-labelledby="display-session-heading">
      <h2 class="display-session-status" id="display-session-heading"></h2>
      <p class="display-session-name"></p>
      <time class="display-session-time"></time>
      <p class="display-session-detail"></p>
    </section>

    <div class="grandprix-grid"></div>

  </main>
  <script src="script.js"></script>
</body>
</html>
